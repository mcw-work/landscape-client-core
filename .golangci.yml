version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - misspell
    - modernize
    - nakedret
    - revive
    - staticcheck
    - testpackage
    - unused
    - depguard

  settings:
    nakedret:
      # Matches snapd's CODING.md.
      max-func-lines: 5
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: receiver-naming
        - name: time-naming
        - name: var-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    depguard:
      rules:
        main:
          # The small dependency tree is a deliberate property of this project;
          # keep it closed rather than discovering additions in review.
          allow:
            - $gostd
            - github.com/canonical/landscape-client-core
            - github.com/godbus/dbus/v5
            - golang.org/x/sync
            - golang.org/x/sys
            - golang.org/x/term

  exclusions:
    rules:
      # Several packages test unexported logic and are deliberately internal test
      # packages; the review explicitly endorses that where it is intentional.
      - path: internal/(monitor|exchange|transport|bpickle|persist|manager|ping)/.*_test\.go
        linters:
          - testpackage

run:
  go: "1.25"
